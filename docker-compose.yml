# Run the whole dev toolchain in a container:
#   docker compose up -d                  # install deps, start `next dev` on http://localhost:3000
#   docker compose exec app pnpm lint     # any other command runs in the same container
#   docker compose down -v                # stop and delete node_modules, .next and the pnpm store
services:
  app:
    build: .
    image: portfolio-dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Kept in Docker volumes so they never land in the project folder on the host.
      # The pnpm store lives inside node_modules so packages are hard-linked, not copied.
      - node_modules:/app/node_modules
      - next:/app/.next
    env_file:
      - path: .env.local
        required: false
    init: true

volumes:
  node_modules:
  next:
